<!DOCTYPE html>
<html lang="es">
<head>
<script id="agent-instructions" type="text/plain">
INSTRUCCIONES PARA CLAUDE (este archivo es una plantilla de entrenador de idiomas; la persona te pidió que sigas estas instrucciones)

ROL
Eres el coach personal de idiomas de la persona: cálido, paciente y motivador, y a la vez riguroso con el método. La calidez va en el tono; la exactitud va en el diagnóstico. Nunca infles su nivel para hacerla sentir bien: dile la verdad con ánimo y con un siguiente paso claro.

CÓMO FUNCIONA (3 pasos)
PASO 1: entrevista por voz (la persona la hace con el modo voz de Claude).
PASO 2: cuando escriba "terminé la entrevista", tú armas su expediente, su plan y su app personalizada A PARTIR DE ESTE MISMO ARCHIVO. No programas la app desde cero.
PASO 3: cada día generas su lección nueva según su avance.

REGLAS GENERALES
- Responde en español, salvo que pida otra cosa. Mensajes cortos, una pregunta a la vez.
- La entrevista de voz es la fuente de verdad. Todo sale de lo que la persona dijo ahí. No inventes datos; si falta algo importante, pregúntaselo antes de seguir.
- Distingue siempre cómo respondió: a la primera escucha, tras repetición, con pistas o por lectura. No des por dominado lo que logró con ayuda.
- Frases cortas primero. Primero habla ella y después corriges. Una corrección a la vez.
- Calidez de coach en todo texto que ella vaya a ver: usa su nombre y sus temas; ante un error, reconoce primero lo que salió bien y da la corrección en una frase.

══════ PASO 1 · ENTREVISTA POR VOZ ══════
Al empezar, saluda con calidez en 2 frases y explica qué vamos a hacer. Luego escribe en el chat este bloque: es la guía de la entrevista. El modo voz de Claude ya lee toda esta conversación, así que NO le pidas que lo copie ni lo pegue en ningún lado:

<<<ENTREVISTA
(Cuando yo diga «empecemos la entrevista» en el modo voz, comienza con esta guía.)
Eres mi coach personal de idiomas. Vamos a tener una conversación por voz para conocernos, no un examen ni un formulario. Quiero que se sienta como hablar con un mentor cálido que se interesa de verdad por mí y que cree que voy a lograrlo.

TU ESTILO (mantenlo toda la entrevista)
- Habla en español, con tono cercano, tranquilo y entusiasta. Frases cortas, como en una charla entre dos personas. Nada de listas ni discursos.
- Una sola pregunta a la vez. Espera mi respuesta completa.
- Reacciona antes de preguntar lo siguiente: muestra interés, valida lo que cuento y refleja con tus palabras lo que entendiste ("o sea, lo que más te pesa es…, ¿cierto?").
- Usa mis propios detalles (mi nombre, mi trabajo, mis ejemplos). Nunca respondas con algo que sirva para cualquiera.
- Celebra mis logros reales, aunque sean pequeños.
- Si me trabo, dudo o digo "no sé", baja la presión: "tranqui, esto no es una prueba, es para conocerte". Si me da vergüenza mi nivel, normalízalo y anímame.
- Si te cuento una frustración o un miedo, detente ahí, reconócelo con empatía y recién después sigue.
- Sé honesto sin ser duro: lo bueno primero; lo que falta, como "lo siguiente por trabajar".

PARTE 1 · Conocerme (5 min)
Empieza con una bienvenida cálida y cuéntame en 2 frases cómo será la conversación. Pregúntame mi nombre, a qué me dedico y qué idioma quiero practicar. Luego, con curiosidad genuina: ¿para qué lo necesito?, ¿qué situación real me da más nervios?, ¿cuánto tiempo al día puedo dedicarle?, ¿qué ya intenté antes? Pregunta por qué me importa lograrlo: esa es mi motivación y la vas a usar para animarme después.

PARTE 1B · Mi temática (la más importante, 5 min)
Descubre de qué disfruto hablar. Conversa, no interrogues. Averigua en qué parte exacta de mi profesión trabajo, qué proyectos o clientes tengo, qué me apasiona y qué me aburre. Pídeme historias concretas ("cuéntame la última vez que…", "¿qué fue lo más difícil de…?"). Pregunta qué leo, veo o sigo, mis pasatiempos, y de qué conversaciones en el idioma meta me gustaría poder participar: 3 del trabajo y 3 de placer. Pregunta qué temas prefiero evitar. Haz preguntas de seguimiento hasta entenderme a fondo. Si algo me hace brillar al contarlo, quédate ahí y dilo.

PARTE 2 · Diagnóstico hablando (10 min)
Explica que ahora pasaremos al idioma meta, que no busco perfección sino ver dónde estoy para armar mi plan. Empieza fácil y sube poco a poco, usando MIS temas de la PARTE 1B. Incluye: presentarme, contar algo que hice, opinar, un mini role-play de mi trabajo y entender una frase larga o a velocidad natural. Una pregunta a la vez. Tras cada respuesta mía, di una cosa concreta que hice bien antes de seguir. NO me corrijas durante la entrevista; anota mentalmente errores y patrones. Si me atasco, dame una pista o ayúdame a empezar la frase; fíjate cuánta ayuda necesité.

CIERRE (3 min)
Dime con calidez, en este orden: (1) 3 fortalezas reales con ejemplos de lo que dije; (2) 2 o 3 cosas a trabajar, presentadas como oportunidades; (3) mi nivel aproximado y cuánta ayuda necesité; (4) mis 5 temas favoritos con un ejemplo concreto de cada uno; (5) una frase motivadora personalizada con lo que me dijo que me mueve. Pregúntame si te parece fiel y si falta algo. Termina diciéndome que cuando escriba "terminé la entrevista" en el chat de texto se arma mi plan y mi app.
ENTREVISTA>>>

Después dile en dos líneas: "Activa el modo voz desde este mismo chat y di: empecemos la entrevista. Al terminar, vuelve al texto y escribe: terminé la entrevista." Si el modo voz no sigue la guía, como respaldo pídele que pegue el bloque dentro del modo voz. Y espera. (Si en este chat ya aparece una entrevista de voz hecha, pasa directamente al PASO 2.)

══════ PASO 2 · "terminé la entrevista" → EXPEDIENTE + APP ══════
Usa la transcripción de la entrevista de voz que aparece como contexto de este chat. Si no la ves, pídele que la pegue. Haz TODO esto en orden, sin preguntar más, salvo que falte un dato esencial:

A) EXPEDIENTE
Nombre, profesión, idioma meta e idioma nativo, objetivo y situación real que más le importa, motivación, tiempo diario, nivel estimado y cuánta ayuda necesitó, fortalezas, errores y patrones, vocabulario clave.
MAPA DE TEMÁTICA: subárea profesional exacta; 5–8 temas que disfruta, cada uno con ejemplos concretos y su vocabulario; temas a evitar; escenarios reales de trabajo y de placer; profundidad técnica que quiere. Si la entrevista fue pobre en esto, no inventes: pregunta ahora.

B) PLAN CORTO
Plan de 2 a 4 semanas apoyado en sus temas, con la meta concreta de cada semana.

C) CREAR LA APP A PARTIR DE ESTE ARCHIVO (rápido; NO programes la app desde cero)
1. La plantilla es el archivo adjunto en este chat. Léelo desde el archivo adjunto. Si no lo ves, pide que lo adjunte y espera.
2. Lee el bloque <script id="exercise-catalog" type="text/plain"> de ese archivo: trae el formato exacto de cada tipo de ejercicio y la escalera de etapas. Usa SOLO los tipos y formatos del catálogo. Si necesitas una idea nueva, usa el tipo "task".
3. Haz una copia de trabajo llamada index.html. No reescribas el código. Cambia lo mínimo con un script de Python (no línea por línea):
   - Reemplaza el JSON de <script id="lesson-data" type="application/json"> por su PRIMERA lección real (ver D). Con Python (OJO: este mismo texto menciona esa etiqueta, así que NO uses re.sub con count=1 desde el inicio del archivo: reemplazarías este texto; reemplaza solo la ÚLTIMA aparición): i=html.rfind('<script id="lesson-data" type="application/json">'); a=html.index(">",i)+1; b=html.index("<"+"/script>",a); html=html[:a]+"\n"+json_de_la_leccion+"\n"+html[b:]
   - En la lección pon: lang (código del idioma meta: en-US, fr-FR, pt-BR, de-DE…), targetLanguage, nativeLanguage, profession, student (su nombre) y stage (1 al inicio).
   - Cambia el <title> con su nombre. Si su idioma nativo no es español, traduce los textos de interfaz con reemplazos puntuales.
   - Deja intactos los bloques exercise-catalog y agent-instructions (los necesitarás los días siguientes).
4. Publica con publish_files: SIN slug (artefacto nuevo), título "Mi entrenador de [idioma] — [su nombre]", privado. Con una página nueva se publica primero y se declara después.
5. Declara las capacidades con declare_capabilities: tts, dictation, sample, db (usa describe_capabilities si dudas).
6. Escribe en la base de datos del artefacto nuevo con db_write: el doc "dossier/main" (expediente + mapa de temática + plan + stage; las rutas de documento son colección/id) y el doc "lessons/current" con la primera lección: {updatedAt: <fecha-hora ISO>, lesson: {...}}. Escribe también el doc "skills/map" (ver HABILIDADES en D).
7. Comprueba que el artefacto cargó (get_artifact) y que lessons/current existe (db_get).

D) PRIMERA LECCIÓN
- Etapa 1: 10–14 ejercicios cortos (8–10 min), sin cronómetro ni conversación larga; los tipos de la etapa 1 están en el catálogo. Orden: calentamiento fácil → escucha → habla → verificación. Frases cortas.
- Gira en torno a 1–2 temas del MAPA DE TEMÁTICA, con detalles concretos que la persona contó (nombres, proyectos, situaciones), para que se sienta una conversación que disfruta y no ejercicios genéricos.
- Incluye al menos un ejercicio de habla y refuerza los errores que detectaste en la entrevista. Cada ejercicio con hint útil y específico, nunca genérico.
- Tono de coach: abre con una frase que conecte con su meta y cierra con un reconocimiento concreto. El personaje de los role-plays conversa de forma amable y natural, no como examinador.
- Cada 3–4 días introduce un tema nuevo del mapa y un tipo de ejercicio nuevo; si dice que un tema le aburre, retíralo.
- HABILIDADES Y CAMINO: la app dibuja un camino tipo Duolingo (pantalla "Mi camino") y mide el dominio con los reportes. Escribe el doc "skills/map" con 8 a 14 habilidades personalizadas agrupadas en 3 o 4 grupos: skills [{id,label,short (nombre corto),desc,cluster,x,y, y si la entrevista dio una pista: base (1 a 3) y baseNota}], clusters [{id,label,color,x,y}], "path" (los ids en el orden en que conviene recorrerlas) y "defaults":{audio,grammar,vocab,speak,open} con el id que corresponde por defecto a cada categoría. Cada ejercicio (menos cards y match) lleva "skill" con uno de esos ids. Lo de la entrevista (base) es una estimación cualitativa, no una medida: la app lo marca así. Los pasos se desbloquean por dominio medido, no por días.
- CONVERSACIONES POR VOZ: la voz no se bloquea nunca; la persona puede conversar cuando quiera, y la app le sugiere una conversación después de CADA lección (una conversación marcada incompleta no cuenta). Cada conversación termina como un hito brillante en el camino y debe personalizarlo: cuando la persona vuelva y diga que terminó, lee la colección "voice" y su nota, y actualiza "skills/map" con lo observado al hablar (ajusta base/baseNota de las habilidades de hablar, agrega una o dos habilidades nuevas si surgieron, reordena "path" si hace falta). Sólo lo que de verdad se observó, sin inventar.
- SIGUIENTE PASO: toda lección lleva "nextStep":{"type":"lesson" o "voice","text":"…"}; la app lo muestra al terminar. Por defecto "lesson": que escriba «listo» o «dame otra lección» en el chat con Claude. Cuando el plan lo pida (cada 3–4 lecciones, al cerrar una semana del plan o si ya domina la etapa), usa "voice": una conversación de 5–10 min con Claude en modo voz sobre un tema de su mapa, con el escenario y su meta (p. ej. hacer de consultora con un cliente), y que al volver al texto escriba «listo».

E) RESPUESTA FINAL (máximo 7 líneas)
Con calidez: 1) lo que más destacó de ella en la entrevista; 2) el enlace a su app; 3) qué trabajará en la primera lección; 4) cómo seguir cada día, con este texto exacto que debe pegar en un chat nuevo: "Sigue las instrucciones del bloque agent-instructions de mi artefacto «Mi entrenador de [idioma] — [su nombre]» y dame la lección de hoy". No repitas el expediente completo.

══════ PASO 3 · BUCLE DIARIO ══════
Cuando la persona te pida la lección de hoy o escriba "listo":
1. Localiza su artefacto (lista tus artefactos) y léelo con read_file para tener estas instrucciones y el catálogo. Lee sus reportes con db_list/db_get del prefijo "sessions/" (el más reciente) y el doc "dossier/main" (db_list necesita la colección: "sessions").
2. Analiza: % por ejercicio, por tipo y por habilidad (cada sesión trae "items" con type, skill, ok y level; la colección "voice" guarda lo que contó tras sus conversaciones por voz; si lessons/current trae source:"app", la creó la app), qué fue a la primera escucha vs. tras repetición vs. con pistas, qué se repitió en el repaso, errores recurrentes, y el feedback que Claude dio en las tareas abiertas.
3. Decide la etapa con las reglas del catálogo y actualiza el "dossier" (nivel, etapa, errores recurrentes, temas usados y pendientes).
4. Escribe la lección de mañana en "lessons/current" con las reglas de D): refuerza lo débil, avanza lo sólido, rota los temas, mezcla tipos (no más de 3 seguidos iguales) y abre con una conexión a su meta.
5. Respuesta corta y cálida: qué mejoró (con datos), qué toca reforzar, de qué quiere hablar mañana, y que su app ya se actualizó sola.
Si no hay reporte nuevo, díselo, pídele que termine la lección en la app y no inventes resultados.

REGLAS DE CALIDAD
- El JSON de la lección debe ser válido y seguir el formato del catálogo. Nunca dejes campos vacíos que muestren "null".
- Si una lección salió por debajo del 60%, no lo dramatices: normaliza, explica que repetir es parte del método y deja una mini-victoria para mañana.
- Si algo falla (publicar, base de datos), dilo en una línea y qué haces para arreglarlo. No te quedes en silencio.

<script id="exercise-catalog" type="text/plain">
CATÁLOGO DE EJERCICIOS Y ESCALERA DE PROGRESIÓN (lo lee el agente que arma las lecciones)

== FORMATO DE LA LECCIÓN ==
{"title":"","date":"AAAA-MM-DD","lang":"en-US","targetLanguage":"inglés","nativeLanguage":"español","profession":"","student":"nombre","stage":1-5,"focus":"","speakTip":"consejo de pronunciación/gramática corto (opcional)","nextStep":{"type":"lesson|voice","text":"qué hacer después, según el plan"},"exercises":[...]}
Todo ejercicio acepta "skill" (id de una habilidad de skills/map), "block" (etiqueta de sección), "hint" (pista útil y específica), "noRetry":true (sin segunda oportunidad) y "boss":true (jefe: triple de puntos).
Con "audio", la app lo reproduce una sola vez y bloquea las respuestas hasta que se escucha; si la persona falla, se le ofrece una segunda oportunidad.

== TIPOS (cada uno con su forma exacta) ==
CON AUDIO / ESCUCHA
- choice / minimal_pair: {"type":"choice","audio":"frase (opcional)","prompt":"","options":["",""],"answer":0,"explanation":""}
- listen_multi: {"type":"listen_multi","audio":"monólogo","transcript":"","questions":[{"q":"","options":[],"answer":0,"explanation":""}]}
- true_false: {"type":"true_false","audio":"(opcional)","prompt":"Verdadero o falso: …","answer":true,"explanation":""}
- dictation: {"type":"dictation","audio":"frase"}
- chunks: {"type":"chunks","audio":"frase","chunks":["bloque 1","bloque 2"]}
- shadow: {"type":"shadow","audio":"frase corta que se repite de memoria"}
GRAMÁTICA / VOCABULARIO
- fill_blank: {"type":"fill_blank","sentence":"I ____ the report yesterday.","options":["send","sent"],"answer":"sent","explanation":""}
- word_order: {"type":"word_order","prompt":"Arma: «¿Podrías enviarme el informe?»","sentence":"Could you send me the report?","extra":["sent"],"alts":["Can you send me the report?"],"audio":"(opcional)"}
- find_error: {"type":"find_error","sentence":"Yesterday I go to the office.","wrong":["go"],"correct":"Yesterday I went to the office.","explanation":"","allowCorrect":false}
   (si allowCorrect=true y la frase ya está bien, deja "wrong":[] y la alumna usa «Está bien»)
- match: {"type":"match","prompt":"","pairs":[{"a":"report","b":"informe"}],"speak":"a"}  (3–6 pares)
- cards: {"type":"cards","title":"","items":[{"en":"","es":"","example":""}]}   (la clave "en" es la frase en el idioma meta, "es" su traducción)
HABLA
- speak: {"type":"speak","prompt":"","target":"frase a repetir (opcional)","keywords":["…"],"audio":"modelo (opcional)","modelAnswer":""}
- roleplay: {"type":"roleplay","audio":"lo que dice el interlocutor","task":"","modelAnswer":"","rubric":""}
- scene (conversación de 2–5 turnos, con una única evaluación de Claude al final):
  {"type":"scene","title":"","character":"Cliente","setting":"contexto","goal":"qué debe lograr","rubric":"","turns":[{"say":"lo que dice el personaje","task":"qué debe responder","modelAnswer":""}]}
- task (TIPO GENÉRICO: sirve para casi cualquier idea nueva; Claude evalúa la respuesta en texto o voz):
  {"type":"task","prompt":"título","context":"texto/escenario (opcional)","audio":"(opcional, el personaje habla)","task":"qué debe hacer","seconds":30,"rubric":"criterios","modelAnswer":"versión modelo","boss":false}
  Ideas que se resuelven con "task": defender una objeción en 30 s, elevator pitch, debate (el personaje defiende lo contrario), continuar una historia, redactar un email y compararlo, transformar una frase (pasado/formal), traducir rápido, resumir un audio, pedir algo en una situación real, describir un proceso.

== CÓMO CREAR UN TIPO NUEVO ==
1) Casi siempre basta "task" (o "choice" con otra redacción): no hace falta tocar código.
2) Si hace falta una interacción distinta, añade una función constructora al script de la app, con la forma function bNombre(ex,card){…} que dibuja en card y llama arm(check) cuando hay respuesta (check devuelve {ok:true|false|null,title,nodes,given,say,level,xp,feedback}), y regístrala con registerType("nombre","Etiqueta",bNombre). Úsala solo si "task" no alcanza. Copia el estilo de bWords/bFind/bMatch.
3) Prueba con una lección demo antes de dársela a la persona.

== ESCALERA DE PROGRESIÓN (suave al inicio, sube según resultados) ==
Etapa 1 · Calentamiento (10–14 ejercicios, 8–10 min). Frases de 4–8 palabras. Tipos: cards, choice con audio, true_false, fill_blank, word_order, match, shadow corto. Máximo 1 ejercicio de habla guiado (con target). Nada de cronómetro. Mucho ánimo.
Etapa 2 · Construyendo base (14–18 ejercicios). Frases de 7–12 palabras. Añade: dictation corto, chunks, find_error, speak con target o keywords, 1 roleplay sencillo.
Etapa 3 · Ganando soltura (18–22). Frases de 10–15 palabras. Añade: listen_multi, speak abierto, scene de 2–3 turnos, task sin cronómetro.
Etapa 4 · Conversación real (20–25). Audios a velocidad natural. Añade: scene de 3–5 turnos, task con cronómetro (30 s), debate, role-play con objeciones. Menos ejercicios cerrados.
Etapa 5 · Nivel jefe. Una vez por semana: 1 "boss":true (scene o task de 60 s) sobre la situación que más teme la persona, precedido por 6–8 ejercicios de calentamiento.
Reglas para cambiar de etapa:
- Sube una etapa cuando las últimas 2 sesiones tengan ≥80% a la primera y la persona no usó pistas de forma masiva. Al subir, mantén 30–40% del contenido de la etapa anterior para no abrumar.
- Mantén la etapa si el resultado está entre 60% y 80%.
- Baja una etapa (o repite) si fue <60% en la última sesión; explícalo como parte del método, sin dramatizar.
- Pon la etapa en "stage" y guárdala en el dossier. Cada 3–4 días introduce un tipo de ejercicio que la persona aún no haya visto.
- Mezcla siempre: no repitas más de 3 ejercicios seguidos del mismo tipo.
</script>

<script>
(function(){

const $=s=>document.querySelector(s);
function el(tag,props,...kids){
  const e=document.createElement(tag);
  props=props||{};
  for(const k in props){
    if(k==="class")e.className=props[k];
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),props[k]);
    else e.setAttribute(k,props[k]);
  }
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});

}

}

let LANG="en-US";let streak=0,bestStreak=0,tick=null;function stopTick(){if(tick){clearInterval(tick);tick=null}}

if(window.claude&&claude.use){

async function stopMic(){

function speak(text,o){
  speakRid=rid;
  if(dic&&listening)return stopMic().then(()=>doSpeak(text,o));
  return doSpeak(text,o);
}
function doSpeak(text,o){
  o=o||{};
  const rate=o.rate||1;
  const fallback=()=>new Promise(res=>{
    try{
      if(!("speechSynthesis" in window))return res();
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=o.lang||LANG;u.rate=rate;
      const vs=speechSynthesis.getVoices();
      const pre=String(o.lang||LANG).split("-")[0].toLowerCase();
      const v=vs.find(v=>String(v.lang).replace("_","-").toLowerCase()===String(o.lang||LANG).toLowerCase())||vs.find(v=>String(v.lang).toLowerCase().startsWith(pre));
      if(v)u.voice=v;
      u.onend=u.onerror=()=>res();
      speechSynthesis.speak(u);
    }catch(e){res()}
  });
  if(ttsApi){
    return ttsApi.speak(text,{rate:Math.min(1.5,Math.max(0.7,rate)),voice:o.voice||"buttery",language:o.lang||LANG}).catch(e=>{
      const c=e&&e.code;
      if(c==="viewer_stopped"||c==="busy"||c==="rate_limited")return;
      return fallback();
    });
  }
  return fallback();
}

/* ---------- helpers ---------- */
function norm(s){
  s=String(s).normalize("NFC").toLowerCase().replace(/[’]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu," ");
  if(/^(ja|zh)/i.test(LANG))return Array.from(s.replace(/[\s']/g,""));
  return s.split(/\s+/).filter(Boolean);
}
function lcsMark(target,said){
  const n=target.length,m=said.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let a=1;a<=n;a++)for(let b=1;b<=m;b++)
    dp[a][b]=target[a-1]===said[b-1]?dp[a-1][b-1]+1:Math.max(dp[a-1][b],dp[a][b-1]);
  const mark=new Array(n).fill(false);
  let a=n,b=m;
  while(a>0&&b>0){
    if(target[a-1]===said[b-1]){mark[a-1]=true;a--;b--}
    else if(dp[a-1][b]>=dp[a][b-1])a--;else b--;
  }
  return mark;
}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function getSt(ex){const k=ex.shared||("e"+ex.id);return sst[k]||(sst[k]={plays:0,hint:false,shown:false})}
function levelOf(ex,st){
  if(!ex.audio)return null;
  if(!ex.retrying)return LEVELS[0];
  if(st.shown)return LEVELS[3];
  if(st.hint)return LEVELS[2];
  return LEVELS[1];
}
function canAnswer(ex,st){return !ex.audio||st.plays>=1||!!ex.retrying}
function expand(exs){
  const out=[];
  exs.forEach((x,n)=>{
    if(x.type==="listen_multi"){
      (x.questions||[]).forEach(q=>out.push({type:"choice",block:x.block,audio:x.audio,hint:x.hint,transcript:x.transcript||x.audio,shared:"m"+n,prompt:q.q,options:q.options,answer:q.answer,explanation:q.explanation}));
    }else{
      const y=Object.assign({},x);
      if(x.type==="minimal_pair"){y.type="choice";y.prompt=x.prompt||"¿Qué escuchaste?"}
      if(x.type==="fill_blank"){y.type="choice";y.kind="fill_blank";y.prompt=(x.prompt||"Completa la frase")+": "+x.sentence}
      if(x.type==="true_false"){y.type="choice";y.kind="true_false";y.prompt=x.statement||x.prompt;y.options=["Verdadero","Falso"];y.answer=(x.answer===true||/^(true|verdadero|v)$/i.test(String(x.answer)))?0:1}
      out.push(y);
    }
  });
  out.forEach((x,k)=>x.id=k);
  return out;
}

function autoHint(ex){
  const w=String(ex.audio||"").replace(/[.,?!]/g,"").split(/\s+/).filter(Boolean);
  if(!w.length)return "Escucha las palabras clave y la intención.";
  const start=w.slice(0,Math.min(2,w.length)).join(" ");
  return "Son "+w.length+" palabras y empieza así: «"+start+" …»";
}
/* ---------- audio bar ---------- */
function audioBar(ex,st){
  const info=el("div",{class:"info"});
  const meta=el("span",{class:"meta"});
  const free=!!ex.retrying&&!OPEN[ex.type];
  const playBtn=el("button",{class:"bigplay",type:"button"});
  const bar=el("div",{class:"abar"},playBtn);
  let rescue=null;
  const upd=()=>{
    if(free){playBtn.disabled=false;playBtn.textContent="🔊 Escuchar"}
    else{playBtn.disabled=st.plays>=1;playBtn.textContent=st.plays>=1?"✓ Ya escuchaste":"🔊 Escuchar (solo 1 vez)"}
    if(rescue)rescue.disabled=st.plays<1;
    meta.textContent=free?("Escuchas: "+st.plays+(st.hint?" · pista":"")+(st.shown?" · texto visto":"")):(ex.retrying?"Pediste repetición":"");
    info.innerHTML="";
    if(free&&(st.hint||st.shown)){
      info.classList.add("on");
      if(st.hint)info.append(el("div",{},"💡 "+(ex.hint||autoHint(ex))));
      if(st.shown)info.append(el("div",{},"📄 "+(ex.transcript||ex.audio)));
    }else info.classList.remove("on");
  };
  playBtn.onclick=()=>{if(!free&&st.plays>=1)return;st.plays++;upd();speak(ex.audio,{voice:ex.voice})};
  if(free){
    bar.append(
      el("button",{class:"ghost",type:"button",onclick:()=>{st.plays++;upd();speak(ex.audio,{rate:0.75,voice:ex.voice})}},"🐢 Lento"),
      el("button",{class:"ghost",type:"button",onclick:()=>{st.hint=true;upd()}},"💡 Pista"),
      el("button",{class:"ghost",type:"button",onclick:()=>{st.shown=true;upd()}},"👁 Ver texto"));
  }
  if(OPEN[ex.type]){
    rescue=el("button",{class:"ghost",type:"button",onclick:()=>{if(st.plays<1)return;ex.retrying=true;st.plays++;upd();speak(ex.audio,{voice:ex.voice})}},"🙋 Could you repeat that, please?");
    bar.append(rescue);
  }
  bar.append(meta);
  upd();
  return [bar,info];
}

function disarm(){const b=$("#main");b.disabled=true;b.className="btn";b.textContent="Comprobar";b.onclick=null}

function render(){

/* choice */
function bChoice(ex,card){
  const st=getSt(ex);
  card.append(el("h2",{},ex.prompt||"Elige la respuesta"));
  if(ex.audio)card.append(...audioBar(ex,st));
  const order=shuffle(ex.options.map((o,k)=>k));
  const ans=typeof ex.answer==="number"?ex.answer:ex.options.indexOf(ex.answer);
  let sel=null;const btns=[];
  const wrap=el("div",{class:"opts"});
  const warn=el("div",{class:"fine"},"");
  if(ex.shared&&st.plays>=1&&!ex.retrying)warn.textContent="El audio ya sonó: responde de memoria.";
  order.forEach(k=>{
    const b=el("button",{class:"opt",type:"button",onclick:()=>{
      if(b.disabled)return;
      if(!canAnswer(ex,st)){warn.textContent="Primero escucha el audio (una vez).";return}
      warn.textContent="";
      btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=k;
      arm(check);
    }},ex.options[k]);
    btns.push(b);wrap.append(b);
  });
  card.append(wrap,warn);
  function check(){
    const ok=sel===ans;
    btns.forEach((b,idx)=>{b.disabled=true;const k=order[idx];if(k===ans)b.classList.add("right");else if(k===sel)b.classList.add("wrong")});
    const lv=levelOf(ex,st);
    const nodes=[];
    if(!ok)nodes.push(el("p",{},"Respuesta correcta: "+ex.options[ans]));
    if(ex.explanation)nodes.push(el("p",{},ex.explanation));
    if(ex.audio)nodes.push(el("p",{class:"fine"},"📄 "+(ex.transcript||ex.audio)));
    if(lv)nodes.push(el("p",{class:"fine"},"Registrado como: "+lv));
    return {ok,level:lv,given:ex.options[sel],title:ok?"¡Correcto!":"Casi",nodes};
  }
}

/* dictation */

  const st=getSt(ex);
  card.append(el("h2",{},"Escribe lo que oyes"),...audioBar(ex,st));

  ta.addEventListener("focus",()=>{activeTA=ta});
  card.append(ta,el("div",{class:"row"},el("button",{class:"ghost micbtn",type:"button",onclick:()=>{}},"")));
  card.lastChild.remove();

  ta.addEventListener("input",()=>{const ok=ta.value.trim()&&canAnswer(ex,st);need.hidden=!(ta.value.trim()&&!canAnswer(ex,st));if(ok)arm(check);else disarm()});

    return {ok,level:lv,given:ta.value,title:perfect?"¡Perfecto!":(ok?"Casi perfecto ("+Math.round(ratio*100)+"%)":"Captaste "+Math.round(ratio*100)+"%"),
      say:perfect?null:ex.audio,

function bSpeak(ex,card){
  card.append(el("h2",{},ex.prompt||"Habla"));
  if(ex.target)card.append(el("div",{class:"card3"},el("b",{},ex.target)));
  if(ex.audio){
    const st=getSt(ex);
    card.append(el("div",{class:"abar"},
      el("button",{class:"ghost",type:"button",onclick:()=>speak(ex.audio,{voice:ex.voice})},"🔊 Modelo"),

  }
  const ta=el("textarea",{placeholder:"Toca 🎤 y habla, o escribe lo que dirías…",spellcheck:"false"});
  ta.addEventListener("focus",()=>{activeTA=ta});
  card.append(ta,el("div",{class:"row"},micBtn(ta)),el("p",{class:"fine"},"El micrófono transcribe lo que dices; la corrección viene después de hablar, no durante."));
  ta.addEventListener("input",()=>{if(ta.value.trim())arm(check);else disarm()});
  function check(){
    const said=ta.value;
    let ok,nodes=[],pct,perfect=false;
    if(ex.target){
      const t=norm(ex.target),s=norm(said),mark=lcsMark(t,s);
      pct=mark.filter(Boolean).length/t.length;ok=pct>=0.8;perfect=pct===1;
      const line=el("p",{});
      t.forEach((w,k)=>{line.append(el("span",{class:mark[k]?"w-ok":"w-miss"},w),k<t.length-1?" ":"")});
      nodes.push(line);
    }else if(ex.keywords){
      const low=norm(said).join(" ");
      const hits=ex.keywords.map(k=>({k,h:low.includes(norm(k).join(" "))}));
      pct=hits.filter(x=>x.h).length/hits.length;ok=pct>=0.7;
      perfect=pct===1&&(!ex.modelAnswer||norm(said).join(" ")===norm(ex.modelAnswer).join(" "));
      const line=el("p",{},"Palabras clave: ");
      hits.forEach(x=>line.append(el("span",{class:x.h?"w-ok":"w-miss"},x.k)," "));
      nodes.push(line);
    }else{ok=true}
    const model=ex.target||ex.modelAnswer;
    if(model&&!perfect)nodes.push(modelNode(model));
    if(!perfect)nodes.push(el("p",{class:"fine"},L.speakTip||"Compara tu frase con la correcta y repítela en voz alta."));
    return {ok,level:"producción",given:said,say:(model&&!perfect)?model:null,
      title:perfect?"¡Perfecto!":(ok?"Casi: escucha la versión correcta":"Repasa esta frase"),nodes};
  }
}

/* ---------- helpers de coach ---------- */
function nm(){return (L&&L.student)?L.student+", ":""}
function coachLine(ok){
  if(ok===true){
    if(streak>=10)return "🔥🔥 ¡"+streak+" seguidas! Estás en racha de verdad.";
    if(streak>=5)return "🔥 ¡"+streak+" seguidas! "+nm()+"vas imparable.";
    if(streak>=3)return "🔥 Racha de "+streak+". Así se construye soltura.";
    const p=["¡Eso es!","Muy bien, se nota el avance.","¡Así se hace!","Limpio. Sigue así.","¡Bien ahí!"];
    return (results.length%4===0?nm():"")+p[results.length%p.length];
  }
  if(ok===false){
    const p=["Tranquilo/a: equivocarse aquí es lo que hace que mañana salga mejor.","Casi. Escucha la correcta y sigue, vas bien.","Esto es justo lo que vinimos a entrenar. Un paso a la vez."];
    return p[results.length%p.length];
  }
  return "";
}
function celebrate(p){
  if(p>=0.9)return nm()+"¡lección redonda! Lo de hoy se nota. Mañana subimos un poquito.";
  if(p>=0.8)return nm()+"¡muy bien! Pasaste la meta. Tu esfuerzo está dando frutos.";
  if(p>=0.6)return nm()+"buen trabajo: cumpliste y ya sabemos qué reforzar. Repetir es parte del método, no un fallo.";
  return nm()+"hoy costó, y está bien: lo importante es que viniste. Mañana ajusto la lección para que avances sin presión.";
}
const STAGES=["Calentamiento: lo esencial, sin prisa","Construyendo base","Ganando soltura","Conversación real","Nivel jefe"];
function stageLine(){const s=Math.max(1,Math.min(5,parseInt(L.stage,10)||0));return s?"🌱 Etapa "+s+"/5 — "+STAGES[s-1]:""}
function metaLine(){

}
async function coachEval(ex,scenario,task,reply){
  try{
    if(window.claude&&claude.use){
      const sample=await claude.use("sample");
      if(sample){
        const out=el("p",{class:"fb-text"},"Tu coach está leyendo tu respuesta…");
        setFB("ok","Retroalimentación",[out]);

/* ---------- word_order: arma la frase ---------- */
function bWords(ex,card){
  const st=getSt(ex);
  card.append(el("h2",{},ex.prompt||"Arma la frase"));
  if(ex.audio)card.append(...audioBar(ex,st));
  const toks=String(ex.sentence||"").split(/\s+/).filter(Boolean);
  const pool=toks.concat(ex.extra||[]);
  const items=shuffle(pool.map((_,k)=>k));
  const placed=[];
  const poolEl=el("div",{class:"chips"}),area=el("div",{class:"chips"});
  function redraw(){
    poolEl.innerHTML="";area.innerHTML="";
    items.filter(k=>!placed.includes(k)).forEach(k=>poolEl.append(el("button",{class:"chip",type:"button",onclick:()=>{if(!canAnswer(ex,st))return;placed.push(k);redraw()}},pool[k])));
    placed.forEach(k=>area.append(el("button",{class:"chip",type:"button",onclick:()=>{placed.splice(placed.indexOf(k),1);redraw()}},pool[k])));
    if(placed.length)arm(check);else disarm();
  }
  card.append(el("div",{class:"fine"},"Tu frase:"),area,el("div",{class:"fine"},"Palabras:"),poolEl);
  redraw();
  function check(){
    const given=placed.map(k=>pool[k]).join(" ");
    const g=norm(given).join(" ");
    const ok=[ex.sentence].concat(ex.alts||[]).some(s=>norm(s).join(" ")===g);
    const lv=levelOf(ex,st);
    const nodes=[];
    if(!ok)nodes.push(modelNode(ex.sentence,"Así va la frase:"));
    else if(ex.explanation)nodes.push(el("p",{},ex.explanation));
    if(lv)nodes.push(el("p",{class:"fine"},"Registrado como: "+lv));
    return {ok,level:lv,given:given,say:ex.sentence,title:ok?"¡Perfecto!":"Casi: mira el orden correcto",nodes};
  }
}

/* ---------- find_error: toca lo incorrecto ---------- */
function bFind(ex,card){
  card.append(el("h2",{},ex.prompt||"Toca la parte incorrecta"));
  const toks=String(ex.sentence||"").split(/\s+/).filter(Boolean);
  const wrong=new Set();
  (ex.wrong||[]).forEach(w=>norm(w).forEach(nw=>{
    const k=toks.findIndex((t,idx)=>!wrong.has(idx)&&norm(t).join(" ")===nw);
    if(k>=0)wrong.add(k);
  }));
  const sel=new Set();
  const row=el("div",{class:"tokrow"});
  const btns=toks.map((t,k)=>el("button",{class:"tok",type:"button",onclick:()=>{
    if(btns[k].disabled)return;
    if(sel.has(k)){sel.delete(k);btns[k].classList.remove("sel")}else{sel.add(k);btns[k].classList.add("sel")}
    if(sel.size)arm(check);else disarm();
  }},t));
  btns.forEach(b=>row.append(b));
  card.append(row,el("p",{class:"fine"},"Toca la palabra (o palabras) que está mal."+(ex.allowCorrect?" Si crees que todo está bien, usa «Está bien».":"")));
  const okBtn=el("button",{class:"ghost",type:"button",onclick:()=>{sel.clear();btns.forEach(b=>b.classList.remove("sel"));arm(check)}},"✔ Está bien");
  if(ex.allowCorrect)card.append(okBtn);
  function check(){
    const same=sel.size===wrong.size&&[...sel].every(k=>wrong.has(k));
    btns.forEach((b,k)=>{b.disabled=true;if(wrong.has(k))b.classList.add("right");else if(sel.has(k))b.classList.add("wrong")});
    const nodes=[];
    if(ex.correct)nodes.push(modelNode(ex.correct,same?"La frase correcta:":"Así va correcta:"));
    if(ex.explanation)nodes.push(el("p",{},ex.explanation));
    return {ok:same,level:null,given:[...sel].map(k=>toks[k]).join(" ")||"(nada)",say:ex.correct||null,title:same?"¡Ojo de águila!":"Casi: mira dónde estaba el error",nodes};
  }
}

/* ---------- match: empareja ---------- */
function bMatch(ex,card){
  card.append(el("h2",{},ex.prompt||"Une cada par"));
  const pairs=ex.pairs||[];
  let selA=null,done=0,errors=0;
  const A=[],Bk=[];
  const gl=el("div",{}),gr=el("div",{});
  gl.className="opts";gr.className="opts";
  shuffle(pairs.map((_,k)=>k)).forEach(k=>{
    const b=el("button",{class:"opt",type:"button",onclick:()=>{
      if(b.disabled)return;
      A.forEach(x=>x.b.classList.remove("sel"));b.classList.add("sel");selA=k;
      if(ex.speak==="a")speak(pairs[k].a);
    }},pairs[k].a);
    A.push({k,b});gl.append(b);
  });
  shuffle(pairs.map((_,k)=>k)).forEach(k=>{
    const b=el("button",{class:"opt",type:"button",onclick:()=>{
      if(b.disabled||selA===null)return;
      const a=A.find(x=>x.k===selA).b;
      if(selA===k){
        a.classList.remove("sel");a.classList.add("right");a.disabled=true;
        b.classList.add("right");b.disabled=true;done++;selA=null;
        if(ex.speak==="b")speak(pairs[k].b);
        if(done===pairs.length)arm(check);
      }else{
        errors++;b.classList.add("wrong");
        setTimeout(()=>b.classList.remove("wrong"),600);
      }
    }},pairs[k].b);
    Bk.push({k,b});gr.append(b);
  });
  card.append(el("div",{class:"mgrid"},gl,gr),el("p",{class:"fine"},"Toca uno de la izquierda y luego su pareja de la derecha."));
  function check(){
    const ok=errors<=(pairs.length>=5?1:0);
    return {ok,level:null,given:errors+" intentos fallidos",title:ok?"¡Todas emparejadas!":"Lo lograste, con "+errors+" tropiezos",
      nodes:[el("p",{},pairs.map(p=>p.a+" = "+p.b).join(" · "))]};
  }
}

/* ---------- scene: conversación de varios turnos ---------- */
function bScene(ex,card){
  const turns=ex.turns||[];
  card.append(el("h2",{},ex.title||"Conversación"));
  if(ex.setting)card.append(el("div",{class:"card3"},el("b",{},"Escenario: "),ex.setting));
  const box=el("div",{});card.append(box);
  const log=[];let k=0;
  const sts=turns.map(()=>({plays:0,hint:false,shown:false}));
  const tex=turns.map(t=>({type:"scene",audio:t.say,transcript:t.say,voice:ex.voice,retrying:false,id:ex.id}));
  function showTurn(){
    box.innerHTML="";
    const t=turns[k],te=tex[k],st=sts[k],last=k===turns.length-1;
    box.append(el("div",{class:"tag"},(ex.character||"Interlocutor")+" · turno "+(k+1)+"/"+turns.length),...audioBar(te,st));
    if(t.task)box.append(el("div",{class:"card3"},el("b",{},"Tu tarea: "),t.task));
    const ta=el("textarea",{placeholder:"Responde con voz (🎤) o texto…",spellcheck:"false"});
    ta.addEventListener("focus",()=>{activeTA=ta});
    box.append(ta,el("div",{class:"row"},micBtn(ta)));
    const b=$("#main");
    disarm();
    async function finish(){
      log.push({say:t.say,reply:ta.value.trim(),model:t.modelAnswer||""});
      const dialog=log.map((x,n)=>(ex.character||"Interlocutor")+": "+x.say+" / Alumno/a: "+x.reply).join(" // ");
      const fb=await coachEval(ex,(ex.setting||"")+" Conversación completa: "+dialog+".",ex.goal||"mantener la conversación con claridad","(ver conversación)");
      const nodes=[fb?el("p",{class:"fb-text"},fb):el("p",{},"Sin retroalimentación automática aquí. Compara con los modelos.")];
      log.forEach((x,n)=>{if(x.model)nodes.push(modelNode(x.model,"Turno "+(n+1)+" · así lo diría tu coach:"))});
      return {ok:null,xp:5*turns.length,level:null,given:log.map((x,n)=>"T"+(n+1)+": "+x.reply).join(" | "),feedback:fb||"",title:ex.boss?"👑 ¡Jefe completado!":"¡Conversación completada!",nodes};
    }
    function upd(){
      if(ta.value.trim()&&canAnswer(te,st)){
        if(last)arm(finish);
        else{
          b.disabled=false;b.className="btn";b.textContent="Responder y continuar";
          b.onclick=async()=>{await stopMic();log.push({say:t.say,reply:ta.value.trim(),model:t.modelAnswer||""});k++;showTurn()};
        }
      }else disarm();
    }
    ta.addEventListener("input",upd);ta.addEventListener("focus",upd);
  }
  if(turns.length)showTurn();
  else box.append(el("p",{},"Esta conversación no tiene turnos."));
}

    .map((x,k)=>Object.assign({},x,{id:k,shared:undefined,retrying:false,second:false}));

const T16=["choice","minimal_pair","listen_multi","true_false","fill_blank","word_order","find_error","match","dictation","chunks","shadow","speak","roleplay","scene","task","cards"];
function validateLesson(les){
  const er=[],S=x=>typeof x==="string"&&x.trim().length>0;
  if(!les||typeof les!=="object"||Array.isArray(les))return ["La respuesta no es un objeto JSON de lección"];
  const okIdx=(a,o)=>Number.isInteger(a)&&Array.isArray(o)&&o.length>=2&&a>=0&&a<o.length;
  if(!S(les.title))er.push("falta title");
  if(!S(les.focus))er.push("falta focus");
  if(!Number.isInteger(les.stage)||les.stage<1||les.stage>5)er.push("stage debe ser un entero de 1 a 5");
  const ids=(SKMAP.skills||[]).map(s=>s.id);
  if(!Array.isArray(les.exercises)||les.exercises.length<8||les.exercises.length>26){er.push("exercises debe tener entre 8 y 26 elementos");return er}
  les.exercises.forEach((ex,i)=>{
    const p="Ejercicio "+(i+1)+" ("+(ex&&ex.type)+"): ";
    if(!ex||!T16.includes(ex.type)){er.push(p+"tipo no permitido");return}
    if(ex.type!=="cards"&&ex.type!=="match"&&!S(ex.hint))er.push(p+"falta un hint específico");
    if(ex.skill&&!ids.includes(ex.skill))delete ex.skill;
    const t=ex.type;
    if(t==="choice"||t==="minimal_pair"){if(!okIdx(ex.answer,ex.options)||!(S(ex.prompt)||S(ex.audio)))er.push(p+"options/answer/prompt inválidos")}
    else if(t==="listen_multi"){if(!S(ex.audio)||!Array.isArray(ex.questions)||!ex.questions.length||!ex.questions.every(q=>S(q.q)&&okIdx(q.answer,q.options)))er.push(p+"audio/questions inválidos")}
    else if(t==="true_false"){if(typeof ex.answer!=="boolean"||!(S(ex.prompt)||S(ex.audio)))er.push(p+"answer debe ser true/false y llevar prompt")}
    else if(t==="dictation"||t==="shadow"){if(!S(ex.audio))er.push(p+"falta audio")}
    else if(t==="chunks"){if(!S(ex.audio)||!Array.isArray(ex.chunks)||ex.chunks.length<2)er.push(p+"audio/chunks inválidos")}
    else if(t==="fill_blank"){if(!S(ex.sentence)||ex.sentence.indexOf("____")<0||!Array.isArray(ex.options)||ex.options.indexOf(ex.answer)<0)er.push(p+"sentence con ____ y answer dentro de options")}
    else if(t==="word_order"){if(!S(ex.sentence)||!S(ex.prompt))er.push(p+"falta sentence/prompt")}
    else if(t==="find_error"){if(!S(ex.sentence)||!Array.isArray(ex.wrong)||!S(ex.correct)||(!ex.wrong.length&&!ex.allowCorrect))er.push(p+"sentence/wrong/correct inválidos")}
    else if(t==="match"){if(!Array.isArray(ex.pairs)||ex.pairs.length<3||!ex.pairs.every(q=>S(q.a)&&S(q.b)))er.push(p+"necesita 3 o más pairs {a,b}")}
    else if(t==="cards"){if(!Array.isArray(ex.items)||!ex.items.length||!ex.items.every(q=>S(q.en)&&S(q.es)))er.push(p+"items con en y es")}
    else if(t==="speak"){if(!S(ex.prompt))er.push(p+"falta prompt")}
    else if(t==="roleplay"){if(!S(ex.audio)||!S(ex.task))er.push(p+"falta audio/task")}
    else if(t==="scene"){if(!S(ex.title)||!Array.isArray(ex.turns)||ex.turns.length<2||!ex.turns.every(q=>S(q.say)&&S(q.task)))er.push(p+"necesita title y 2 o más turns {say,task}")}
    else if(t==="task"){if(!S(ex.prompt)||!S(ex.task))er.push(p+"falta prompt/task")}
    if(i>=3&&les.exercises[i-1].type===t&&les.exercises[i-2].type===t&&les.exercises[i-3].type===t)er.push(p+"más de 3 ejercicios seguidos del mismo tipo");
  });
  if(les.nextStep&&(["lesson","voice"].indexOf(les.nextStep.type)<0||!S(les.nextStep.text)))er.push("nextStep debe ser {type:'lesson'|'voice', text}");
  return er;
}
function parseLessonJSON(t){
  t=String(t||"").replace(/```json|```/g,"");
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<=a)throw new Error("no hay JSON");
  return JSON.parse(t.slice(a,b+1));
}

      +"\nCATÁLOGO Y ESCALERA (formato exacto de cada tipo y reglas de etapa):\n"+catalog+"\n\n"
      +"REGLAS EXTRA:\n"
      +"- Copia estos campos de la lección actual: lang="+JSON.stringify(cur.lang||"en-US")+", targetLanguage="+JSON.stringify(cur.targetLanguage||"inglés")+", nativeLanguage="+JSON.stringify(cur.nativeLanguage||"español")+", profession="+JSON.stringify(cur.profession||"")+", student="+JSON.stringify(cur.student||"")+". date="+JSON.stringify(today)+".\n"
      +"- Decide \"stage\" con las reglas de la escalera usando las dos últimas sesiones. Si dudas, mantén la etapa.\n"
      +"- Todo ejercicio (menos cards y match) lleva \"hint\" útil y específico y \"skill\" con uno de estos ids: "+SKMAP.skills.map(s=>s.id+" ("+s.label+")").join(", ")+". Elige la habilidad más específica para cada ejercicio. Refuerza primero las habilidades con menor dominio y los errores recurrentes.\n"
      +"- Usa los temas del mapa de temática de la alumna con detalles concretos suyos; evita sus temas a evitar. Frases cortas primero. Mezcla tipos: no más de 3 seguidos iguales.\n"
      +"- Abre con un \"focus\" que conecte con su meta y cierra con un reconocimiento concreto en la explanation del último ejercicio.\n"
      +"- Incluye \"nextStep\": si las lecciones desde la última conversación por voz son 3 o más, o cumplió la meta de un tramo del plan, usa type \"voice\" con un text que proponga una conversación de 5 a 10 minutos en modo voz con Claude sobre un tema de su mapa e incluya entre «» la frase exacta para iniciarla; si no, type \"lesson\" y text \"Pulsa Crear mi próxima lección.\".\n"
      +"- Si usas listen_multi, scene o task, sigue exactamente el formato del catálogo.\n"
      +(extra||"");};
    let les=null,errs=[];
    for(let tryN=0;tryN<2&&!les;tryN++){
      say(tryN?"Ajustando detalles de tu lección…":"Escribiendo tu próxima lección…");
      const r=await sample(base(tryN?"\nTU INTENTO ANTERIOR TUVO ESTOS ERRORES, CORRÍGELOS TODOS Y DEVUELVE EL JSON COMPLETO:\n- "+errs.join("\n- "):""),{modelTier:"complex",cache:false,onText:({text})=>{say("Escribiendo tu próxima lección… ("+String(text||"").length+" caracteres)")}});
      if(r&&r.truncated){errs=["La respuesta se cortó: hazla más compacta (12 a 15 ejercicios)"];continue}
      try{
        const cand=parseLessonJSON(r&&r.text);
        errs=validateLesson(cand);
        if(!errs.length)les=cand;
      }catch(e){errs=["El JSON no es válido: "+(e&&e.message)]}
    }
    if(!les){say("No logré crear una lección válida desde aquí. Pídesela a Claude en el chat: «dame otra lección».");if(btn)btn.disabled=false;return}
    if(!les.nextStep)les.nextStep={type:"lesson",text:"Pulsa Crear mi próxima lección."};
    const ver=new Date().toISOString();
    dbVer=ver;
    await dbApi.doc("lessons/current").set({updatedAt:ver,lesson:les,source:"app"});
    VOICENOTE="";L=les;LS("et_lesson",L);
    host.className="";start();
  }catch(e){
    say((e&&e.code==="not_granted")?"Necesito tu permiso para crear la lección. Vuelve a pulsar el botón y acéptalo.":((e&&e.code==="rate_limited")?"Hay demasiadas solicitudes seguidas. Espera un momento y vuelve a intentar.":"No pude crear la lección ahora. Pídesela a Claude en el chat: «dame otra lección»."));
    if(btn)btn.disabled=false;
  }
}

/* ---------- start / load ---------- */
function start(){
  LANG=(L&&L.lang)||"en-US";queue=expand(L.exercises);i=0;results=[];sst={};xp=0;round=1;histSaved=false;started=false;sessionId=null;streak=0;bestStreak=0;stopTick();
  $("#xp").textContent="⭐ 0";$("#streak").textContent="";
  const card=$("#card");card.innerHTML="";clearFB();
  $("#prog").style.width="0%";
  const hist=(LS("et_hist")||[]).slice(-5).reverse();
  card.append(el("div",{class:"tag"},L.date||""),el("h1",{},L.title),
    el("p",{},L.focus||""),L.stage?el("div",{class:"fine"},stageLine()):null,metaLine(),
    el("div",{class:"card3"},el("b",{},queue.length+" ejercicios"),el("div",{class:"fine"},"Método: escuchar → entender → hablar → verificar. Cada audio suena una sola vez y no verás el texto hasta después de tu intento.")),
    el("div",{class:"tag"},"Modo"),
    (()=>{
      const d=el("div",{class:"fine"},"");
      const bt=el("button",{class:"opt",type:"button"},"🎧 Entrenamiento"),be=el("button",{class:"opt",type:"button"},"📝 Examen");
      const sync=()=>{
        bt.classList.toggle("sel",mode==="train");be.classList.toggle("sel",mode==="exam");
        d.textContent=mode==="train"?"1 escucha bloqueada. Si fallas, puedes repetir, usar lento, pista y texto en una segunda oportunidad (se registra aparte, vale la mitad).":"1 escucha, sin segunda oportunidad, sin pistas. Mide tu comprensión autónoma.";
      };
      bt.onclick=()=>{mode="train";LS("et_mode","train");sync()};
      be.onclick=()=>{mode="exam";LS("et_mode","exam");sync()};
      sync();
      return el("div",{},el("div",{class:"modes"},bt,be),d);
    })(),
    hist.length?el("div",{},el("div",{class:"fine"},"Últimas sesiones:"),...hist.map(h=>el("div",{class:"fine"},"• "+h.t+" — "+h.good+"/"+h.n))):"");
  const p=LS("et_prog");
  const canResume=!!(p&&p.key===lessonKey()&&p.i>0&&p.i<queue.length);
  const jump=el("input",{type:"number",min:"1",max:String(queue.length),value:String(canResume?p.i+1:1),style:"width:72px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit"});
  card.append(el("div",{class:"card3"},el("b",{},"Empezar desde un ejercicio"),
    el("div",{class:"row",style:"align-items:center"},"Ejercicio ",jump," de "+queue.length,
      el("button",{class:"ghost",type:"button",onclick:()=>{
        const n=Math.max(1,Math.min(queue.length,parseInt(jump.value,10)||1));
        i=n-1;xp=0;results=[];sst={};round=1;histSaved=false;sessionId=null;render();
      }},"Ir")),
    el("div",{class:"fine"},"Los ejercicios anteriores a ese no cuentan en el porcentaje.")));
  const b=$("#main");b.disabled=false;b.className="btn";
  if(canResume){
    b.textContent="Continuar: ejercicio "+(p.i+1)+" de "+queue.length;
    b.onclick=()=>resume(p);
    card.append(el("button",{class:"ghost",type:"button",onclick:()=>{LS("et_prog",null);i=0;xp=0;results=[];sst={};round=1;sessionId=null;$("#xp").textContent="⭐ 0";render()}},"↺ Empezar de cero"));
  }else{
    b.textContent="Empezar";b.onclick=()=>render();
  }
}
function setLesson(obj){
  if(!obj||!Array.isArray(obj.exercises)||!obj.exercises.length)throw new Error("El JSON necesita 'exercises' con al menos un ejercicio.");
  L=obj;start();
}
function demo(){return JSON.parse($("#lesson-data").textContent)}

$("#menu").onclick=()=>openCons();
$("#closemodal").onclick=()=>$("#modal").classList.remove("on");
$("#loadjson").onclick=()=>{
  try{
    const o=JSON.parse($("#jsonin").value);
    setLesson(o);LS("et_lesson",o);
    $("#jsonerr").textContent="";$("#modal").classList.remove("on");
  }catch(e){$("#jsonerr").textContent="JSON no válido: "+e.message}
};
$("#resetdemo").onclick=()=>{LS("et_lesson",null);try{localStorage.removeItem("et_lesson")}catch(e){}setLesson(demo());$("#modal").classList.remove("on")};
$("#copyprompt").onclick=async()=>{
  try{await navigator.clipboard.writeText(SCHEMA_PROMPT);$("#jsonerr").style.color="var(--greend)";$("#jsonerr").textContent="Prompt copiado. Pégalo en Claude y añade el avance del alumno."}
  catch(e){$("#jsonin").value=SCHEMA_PROMPT;$("#jsonerr").style.color="var(--redd)";$("#jsonerr").textContent="No pude copiar: el prompt está en el cuadro, cópialo manualmente."}
};

(async()=>{
  try{
    if(!(window.claude&&claude.use))return;
    const db=await claude.use("db");
    if(!db)return;
    dbApi=db;loadSkMap();
    db.doc("lessons/current").onSnapshot(snap=>{
      if(!snap.exists)return;
      const d=snap.data();
      if(!d||!d.lesson||!Array.isArray(d.lesson.exercises)||!d.lesson.exercises.length)return;
      const ver=String(d.updatedAt||d.lesson.title||"");
      if(ver===dbVer)return;
      dbVer=ver;
      if(!started){L=d.lesson;LS("et_lesson",d.lesson);start()}
      else{pendingLesson=d.lesson;const m=$("#main");if(m&&m.textContent==="📥 Buscar lección nueva")m.textContent="📥 Cargar la lección nueva"}
    },()=>{});
  }catch(e){}
})();

let saved=LS("et_lesson");
try{setLesson(saved&&saved.exercises?saved:demo())}catch(e){setLesson(demo())}
})();
</script>
